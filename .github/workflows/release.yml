# Builds the Mac app for Apple Silicon and Intel and attaches the disk image
# to a GitHub Release. Runs when a version tag such as v0.1.0 is pushed.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # Skips the Finder window styling of the disk image, which needs a desktop session.
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: The tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the app version $version in src-tauri/tauri.conf.json"
            exit 1
          fi

      - run: npm ci
      - run: npm test
      - run: cargo test -p rirote-vision --lib

      - name: Build the app for Apple Silicon and Intel
        run: npm run release

      - name: Name the disk image
        id: dmg
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          name="RIROTE-VISION-$version-mac.dmg"
          cp target/universal-apple-darwin/release/bundle/dmg/*.dmg "$name"
          shasum -a 256 "$name" > "$name.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "RIROTE VISION $GITHUB_REF_NAME" --notes-file .github/release-notes.md
          gh release upload "$GITHUB_REF_NAME" "${{ steps.dmg.outputs.name }}" "${{ steps.dmg.outputs.name }}.sha256" --clobber

      - name: Keep the build when run by hand
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dmg.outputs.name }}
          path: ${{ steps.dmg.outputs.name }}
